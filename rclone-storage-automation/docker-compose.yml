# Local MinIO server for S3 experiments.

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: rclone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console (not used for transfers)
    volumes:
      - minio-data:/data
    healthcheck:
      # The image has no curl; `mc ready` checks MinIO's health endpoint.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  minio-data:
